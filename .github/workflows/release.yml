name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.5.2)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Windows exe
        run: |
          go run ./tools/genres
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o DriveNotes.exe .
          zip DriveNotes.zip DriveNotes.exe README.md
          sha256sum DriveNotes.exe DriveNotes.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DriveNotes.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" DriveNotes.zip SHA256SUMS.txt --title "DriveNotes $TAG" --target "$GITHUB_SHA" \
              --notes "Download **DriveNotes.zip**, unzip, and run DriveNotes.exe (Windows 10/11, 64-bit). Built by GitHub Actions from commit $GITHUB_SHA. SHA-256 checksums are in SHA256SUMS.txt."
          fi
